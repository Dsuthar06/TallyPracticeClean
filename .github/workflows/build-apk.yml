name: Build Tally Practice APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted project:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project root
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo "The ZIP does not appear to contain a valid Gradle Android project."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "Android project root:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show build environment
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "Building Android project..."
          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_ROOT" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TallyPracticeClean-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
